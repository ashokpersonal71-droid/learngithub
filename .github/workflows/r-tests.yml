
name: IAPM R Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-r:
    name: Test R and Shiny Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install Shiny
        run: |
          install.packages("shiny")
        shell: Rscript {0}

      - name: Run portfolio unit tests
        run: |
          source("tests/test_portfolio.R")
        shell: Rscript {0}

      - name: Check R script syntax
        run: |
          files <- c(
            "R/returns.R",
            "R/portfolio_risk.R",
            "R/capm.R",
            "shiny/portfolio_app/app.R"
          )

          for (f in files) {
            if (!file.exists(f)) {
              stop(paste("Missing file:", f))
            }

            parse(file = f)
            cat("Syntax OK:", f, "\n")
          }
        shell: Rscript {0}

      - name: Check Shiny application loads
        run: |
          app <- shiny::shinyAppFile(
            "shiny/portfolio_app/app.R"
          )

          stopifnot(
            inherits(app, "shiny.appobj")
          )

          cat("Shiny app loaded successfully\n")
        shell: Rscript {0}
